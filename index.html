<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>progrobots | プログロボコン — セレクション</title>
<style>
  :root {
    color-scheme: light;
    --ink: #252823;
    --muted: #687064;
    --paper: #f5f3ee;
    --card: #ffffff;
    --orange: #e88124;
    --orange-soft: #fff0df;
    --green: #419254;
    --green-soft: #e8f5ea;
    --line: #d9ddd5;
    --focus: #3856c8;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px;
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--paper);
  }

  .page-shell {
    width: min(100%, 1080px);
    margin: 0 auto;
  }

  .page-header {
    margin-bottom: 24px;
  }

  .page-header h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 48px);
    letter-spacing: -0.04em;
  }

  .page-header h1 small {
    margin-left: 0.4em;
    font-size: 0.42em;
    letter-spacing: 0;
  }

  .page-header p {
    max-width: 680px;
    margin: 8px 0 0;
    color: var(--muted);
  }

  .selection-layout {
    display: grid;
    grid-template-columns: minmax(210px, 1fr) 402px minmax(230px, 1fr);
    gap: 18px;
    align-items: start;
  }

  .panel,
  .field-panel {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    box-shadow: 0 8px 24px rgba(33, 38, 30, 0.06);
  }

  .panel {
    padding: 16px;
  }

  .panel h2,
  .field-panel h2 {
    margin: 0;
    font-size: 18px;
  }

  .panel-intro {
    min-height: 3em;
    margin: 6px 0 16px;
    color: var(--muted);
    font-size: 14px;
  }

  .enemy-panel {
    border-top: 5px solid var(--green);
  }

  .own-panel {
    border-top: 5px solid var(--orange);
  }

  .unit-card {
    display: grid;
    gap: 8px;
    margin-top: 10px;
    padding: 12px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: #f7f8f5;
    transition: border-color 120ms, background 120ms;
  }

  .unit-card.selected {
    border-color: var(--focus);
    background: #eef1ff;
  }

  .unit-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-weight: 700;
  }

  .unit-focus {
    padding: 0;
    border: 0;
    color: inherit;
    font: inherit;
    font-weight: 700;
    text-align: left;
    background: transparent;
    cursor: pointer;
  }

  .unit-mark {
    display: inline-grid;
    width: 30px;
    height: 30px;
    place-items: center;
    border-radius: 50%;
    color: white;
    font-size: 12px;
  }

  .enemy-panel .unit-mark {
    background: var(--green);
  }

  .own-panel .unit-mark {
    background: var(--orange);
  }

  select {
    width: 100%;
    min-height: 42px;
    padding: 8px 10px;
    border: 1px solid #bfc6ba;
    border-radius: 9px;
    color: var(--ink);
    font: inherit;
    background: white;
  }

  .field-panel {
    overflow: hidden;
  }

  .field-heading {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }

  .field-heading p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  #selectionField {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
    background: white;
    cursor: crosshair;
  }

  #placementStatus {
    min-height: 3.2em;
    margin: 0;
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
  }

  .actions {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }

  #startBattle {
    min-width: min(100%, 320px);
    min-height: 52px;
    padding: 0 24px;
    border: 0;
    border-radius: 999px;
    color: white;
    font: inherit;
    font-weight: 800;
    font-size: 17px;
    background: #30382b;
    box-shadow: 0 8px 18px rgba(35, 42, 31, 0.18);
    cursor: pointer;
  }

  #startBattle:hover {
    background: #171c15;
  }

  button:focus-visible,
  select:focus-visible,
  canvas:focus-visible {
    outline: 3px solid #91a5ff;
    outline-offset: 3px;
  }

  @media (max-width: 900px) {
    body {
      padding: 14px;
    }

    .selection-layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .enemy-panel {
      order: 1;
    }

    .field-panel {
      order: 2;
      width: min(100%, 402px);
      margin: 0 auto;
    }

    .own-panel {
      order: 3;
    }

    .panel-intro {
      min-height: 0;
    }
  }

  @media (max-width: 480px) {
    .page-header h1 small {
      display: block;
      margin: 2px 0 0;
      font-size: 0.48em;
    }
  }
</style>
</head>
<body>
<main class="page-shell">
  <header class="page-header">
    <h1>progrobots <small>プログロボコン</small></h1>
    <p>ロボットのタイプと初期配置を決めて、3対3のプログラムバトルに挑みます。</p>
  </header>

  <div class="selection-layout">
    <section class="panel enemy-panel">
      <h2>1. 相手チームを選択</h2>
      <p class="panel-intro">相手3体のタイプを選びます。選択結果はフィールド上部に表示されます。</p>

      <div class="unit-card">
        <div class="unit-title"><span>相手機1</span><span class="unit-mark">E1</span></div>
        <select class="enemy-type" data-index="0" aria-label="相手機1のタイプ">
          <option value="infighter1">インファイター Lv1</option>
          <option value="sniper1">スナイパー Lv1</option>
        </select>
      </div>
      <div class="unit-card">
        <div class="unit-title"><span>相手機2</span><span class="unit-mark">E2</span></div>
        <select class="enemy-type" data-index="1" aria-label="相手機2のタイプ">
          <option value="infighter1">インファイター Lv1</option>
          <option value="sniper1">スナイパー Lv1</option>
        </select>
      </div>
      <div class="unit-card">
        <div class="unit-title"><span>相手機3</span><span class="unit-mark">E3</span></div>
        <select class="enemy-type" data-index="2" aria-label="相手機3のタイプ">
          <option value="infighter1">インファイター Lv1</option>
          <option value="sniper1">スナイパー Lv1</option>
        </select>
      </div>
    </section>

    <section class="field-panel">
      <div class="field-heading">
        <h2>初期配置</h2>
        <p>自機を選び、オレンジ色のエリアをタップして配置します。</p>
      </div>
      <canvas
        id="selectionField"
        width="400"
        height="600"
        tabindex="0"
        aria-label="上部が相手チーム、下部が自チームの配置フィールド"
      ></canvas>
      <p id="placementStatus" aria-live="polite">自機1を選択中です。下のオレンジ色のエリアをタップしてください。</p>
    </section>

    <section class="panel own-panel">
      <h2>2. 自チームを編成・配置</h2>
      <p class="panel-intro">カードで配置する自機を選択し、タイプを決めます。</p>

      <div class="unit-card own-card selected" data-index="0">
        <div class="unit-title">
          <button class="unit-focus" type="button" data-index="0">自機1を選択</button>
          <span class="unit-mark">A1</span>
        </div>
        <select class="own-type" data-index="0" aria-label="自機1のタイプ">
          <option value="infighter1">インファイター Lv1</option>
          <option value="sniper1">スナイパー Lv1</option>
        </select>
      </div>
      <div class="unit-card own-card" data-index="1">
        <div class="unit-title">
          <button class="unit-focus" type="button" data-index="1">自機2を選択</button>
          <span class="unit-mark">A2</span>
        </div>
        <select class="own-type" data-index="1" aria-label="自機2のタイプ">
          <option value="infighter1">インファイター Lv1</option>
          <option value="sniper1">スナイパー Lv1</option>
        </select>
      </div>
      <div class="unit-card own-card" data-index="2">
        <div class="unit-title">
          <button class="unit-focus" type="button" data-index="2">自機3を選択</button>
          <span class="unit-mark">A3</span>
        </div>
        <select class="own-type" data-index="2" aria-label="自機3のタイプ">
          <option value="infighter1">インファイター Lv1</option>
          <option value="sniper1">スナイパー Lv1</option>
        </select>
      </div>
    </section>
  </div>

  <div class="actions">
    <button id="startBattle" type="button">この編成でバトルへ</button>
  </div>
</main>

<script>
const FIELD_WIDTH = 400;
const FIELD_HEIGHT = 600;
const OWN_ZONE_TOP = FIELD_HEIGHT * 2 / 3;
const STORAGE_KEY = "progrobots-battle-config-v1";

const typeLabels = {
  infighter1: "インファイター Lv1",
  sniper1: "スナイパー Lv1"
};

const defaultConfig = {
  own: [
    {type: "infighter1", x: 100, y: 500},
    {type: "sniper1", x: 200, y: 500},
    {type: "infighter1", x: 300, y: 500}
  ],
  enemy: [
    {type: "infighter1", x: 100, y: 100},
    {type: "sniper1", x: 200, y: 100},
    {type: "infighter1", x: 300, y: 100}
  ]
};

function normalizeConfig(saved) {
  const validType = type => Object.hasOwn(typeLabels, type);

  return {
    own: defaultConfig.own.map((fallback, index) => {
      const unit = saved?.own?.[index];
      return {
        type: validType(unit?.type) ? unit.type : fallback.type,
        x: Number.isFinite(unit?.x) ? Math.max(20, Math.min(380, unit.x)) : fallback.x,
        y: Number.isFinite(unit?.y) ? Math.max(420, Math.min(580, unit.y)) : fallback.y
      };
    }),
    enemy: defaultConfig.enemy.map((fallback, index) => {
      const unit = saved?.enemy?.[index];
      return {
        type: validType(unit?.type) ? unit.type : fallback.type,
        x: fallback.x,
        y: fallback.y
      };
    })
  };
}

function loadConfig() {
  try {
    return normalizeConfig(JSON.parse(localStorage.getItem(STORAGE_KEY)));
  } catch {
    return normalizeConfig(null);
  }
}

let config = loadConfig();
let selectedOwn = 0;

const canvas = document.getElementById("selectionField");
const ctx = canvas.getContext("2d");
const placementStatus = document.getElementById("placementStatus");

function drawField() {
  ctx.clearRect(0, 0, FIELD_WIDTH, FIELD_HEIGHT);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, FIELD_WIDTH, FIELD_HEIGHT);

  ctx.fillStyle = "rgba(65, 146, 84, 0.12)";
  ctx.fillRect(0, 0, FIELD_WIDTH, FIELD_HEIGHT / 3);
  ctx.fillStyle = "rgba(232, 129, 36, 0.14)";
  ctx.fillRect(0, OWN_ZONE_TOP, FIELD_WIDTH, FIELD_HEIGHT / 3);

  ctx.save();
  ctx.setLineDash([7, 7]);
  ctx.strokeStyle = "rgba(70, 78, 67, 0.32)";
  ctx.beginPath();
  ctx.moveTo(0, FIELD_HEIGHT / 3);
  ctx.lineTo(FIELD_WIDTH, FIELD_HEIGHT / 3);
  ctx.moveTo(0, OWN_ZONE_TOP);
  ctx.lineTo(FIELD_WIDTH, OWN_ZONE_TOP);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = "rgba(45, 90, 54, 0.7)";
  ctx.font = "bold 13px system-ui";
  ctx.fillText("相手チーム配置エリア", 14, 24);
  ctx.fillStyle = "rgba(145, 75, 18, 0.75)";
  ctx.fillText("自チーム配置エリア", 14, OWN_ZONE_TOP + 24);

  config.enemy.forEach((unit, index) => {
    drawRobot(unit, "#419254", "E" + (index + 1), 90, false);
  });

  config.own.forEach((unit, index) => {
    drawRobot(unit, "#e88124", "A" + (index + 1), 270, index === selectedOwn);
  });
}

function drawRobot(unit, color, label, direction, selected) {
  ctx.save();
  ctx.translate(unit.x, unit.y);
  ctx.rotate(direction * Math.PI / 180);

  if (unit.type === "sniper1") {
    ctx.fillStyle = color;
    ctx.fillRect(-13, -10, 26, 20);
    ctx.fillStyle = "#263027";
    ctx.fillRect(5, -3, 22, 6);
  } else {
    ctx.fillStyle = color;
    ctx.fillRect(-12, -12, 24, 24);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(15, -9, 5, 0, Math.PI * 2);
    ctx.arc(15, 9, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  if (selected) {
    ctx.beginPath();
    ctx.arc(unit.x, unit.y, 24, 0, Math.PI * 2);
    ctx.strokeStyle = "#3856c8";
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  ctx.fillStyle = "#202124";
  ctx.font = "bold 12px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(label, unit.x, unit.y + 38);
  ctx.font = "11px system-ui";
  ctx.fillText(unit.type === "sniper1" ? "S" : "I", unit.x, unit.y + 4);
  ctx.textAlign = "start";
}

function refreshControls() {
  document.querySelectorAll(".enemy-type").forEach(select => {
    select.value = config.enemy[Number(select.dataset.index)].type;
  });

  document.querySelectorAll(".own-type").forEach(select => {
    select.value = config.own[Number(select.dataset.index)].type;
  });

  document.querySelectorAll(".own-card").forEach(card => {
    card.classList.toggle("selected", Number(card.dataset.index) === selectedOwn);
  });
}

function selectOwnUnit(index) {
  selectedOwn = index;
  refreshControls();
  drawField();
  placementStatus.textContent = "自機" + (index + 1) + "を選択中です。オレンジ色のエリアをタップしてください。";
}

function saveConfig() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
}

document.querySelectorAll(".enemy-type").forEach(select => {
  select.addEventListener("change", event => {
    config.enemy[Number(event.target.dataset.index)].type = event.target.value;
    saveConfig();
    drawField();
  });
});

document.querySelectorAll(".own-type").forEach(select => {
  select.addEventListener("change", event => {
    const index = Number(event.target.dataset.index);
    config.own[index].type = event.target.value;
    selectedOwn = index;
    saveConfig();
    refreshControls();
    drawField();
    placementStatus.textContent = "自機" + (index + 1) + "を" + typeLabels[event.target.value] + "に変更しました。";
  });
});

document.querySelectorAll(".unit-focus").forEach(button => {
  button.addEventListener("click", () => selectOwnUnit(Number(button.dataset.index)));
});

document.querySelectorAll(".own-card").forEach(card => {
  card.addEventListener("click", event => {
    if (event.target.tagName !== "SELECT" && event.target.tagName !== "OPTION") {
      selectOwnUnit(Number(card.dataset.index));
    }
  });
});

canvas.addEventListener("pointerdown", event => {
  const rect = canvas.getBoundingClientRect();
  const pointerX = (event.clientX - rect.left) * FIELD_WIDTH / rect.width;
  const pointerY = (event.clientY - rect.top) * FIELD_HEIGHT / rect.height;

  const hitIndex = config.own.findIndex(unit =>
    Math.hypot(unit.x - pointerX, unit.y - pointerY) <= 26
  );

  if (hitIndex >= 0) {
    selectOwnUnit(hitIndex);
    return;
  }

  if (pointerY < OWN_ZONE_TOP) {
    placementStatus.textContent = "自チームは、下1/3のオレンジ色のエリア内に配置してください。";
    return;
  }

  const x = Math.max(20, Math.min(380, Math.round(pointerX / 20) * 20));
  const y = Math.max(420, Math.min(580, Math.round(pointerY / 20) * 20));
  const overlaps = config.own.some((unit, index) =>
    index !== selectedOwn && Math.hypot(unit.x - x, unit.y - y) < 36
  );

  if (overlaps) {
    placementStatus.textContent = "ほかの自機と重なるため、少し離れた位置を選んでください。";
    return;
  }

  config.own[selectedOwn].x = x;
  config.own[selectedOwn].y = y;
  saveConfig();
  drawField();
  placementStatus.textContent = "自機" + (selectedOwn + 1) + "を配置しました。";
});

document.getElementById("startBattle").addEventListener("click", () => {
  saveConfig();
  // 毎回最新のバトルページを読み込む
  window.location.href = "battle/?v=" + Date.now();
});

refreshControls();
drawField();
</script>
</body>
</html>
