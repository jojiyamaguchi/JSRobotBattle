<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>progrobots | プログロボコン — セレクション</title>
<style>
  :root {
    color-scheme: light;
    --ink: #252823;
    --muted: #687064;
    --paper: #f5f3ee;
    --card: #ffffff;
    --orange: #e88124;
    --orange-soft: #fff0df;
    --green: #419254;
    --green-soft: #e8f5ea;
    --line: #d9ddd5;
    --focus: #3856c8;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px;
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--paper);
  }

  .page-shell {
    width: min(100%, 1080px);
    margin: 0 auto;
  }

  .page-header {
    margin-bottom: 24px;
  }

  .page-header h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 48px);
    letter-spacing: -0.04em;
  }

  .page-header h1 small {
    margin-left: 0.4em;
    font-size: 0.42em;
    letter-spacing: 0;
  }

  .page-header p {
    max-width: 680px;
    margin: 8px 0 0;
    color: var(--muted);
  }

  .selection-layout {
    display: grid;
    grid-template-columns: minmax(210px, 1fr) 402px minmax(230px, 1fr);
    gap: 18px;
    align-items: start;
  }

  .panel,
  .field-panel {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
    box-shadow: 0 8px 24px rgba(33, 38, 30, 0.06);
  }

  .panel {
    padding: 16px;
  }

  .panel h2,
  .field-panel h2 {
    margin: 0;
    font-size: 18px;
  }

  .panel-intro {
    min-height: 3em;
    margin: 6px 0 16px;
    color: var(--muted);
    font-size: 14px;
  }

  .enemy-panel {
    border-top: 5px solid var(--green);
  }

  .own-panel {
    border-top: 5px solid var(--orange);
  }

  .unlock-progress {
    margin: -6px 0 14px;
    padding: 9px 10px;
    border-radius: 9px;
    color: #704715;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.45;
    background: #fff4df;
  }

  select option:disabled {
    color: #8b9187;
  }

  .team-select-label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 800;
  }

  .team-description {
    min-height: 2.8em;
    margin: 9px 2px 4px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
  }

  .unit-card {
    display: grid;
    gap: 8px;
    margin-top: 10px;
    padding: 12px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: #f7f8f5;
    transition: border-color 120ms, background 120ms;
  }

  .unit-card.selected {
    border-color: var(--focus);
    background: #eef1ff;
  }

  .unit-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-weight: 700;
  }

  .unit-focus {
    padding: 0;
    border: 0;
    color: inherit;
    font: inherit;
    font-weight: 700;
    text-align: left;
    background: transparent;
    cursor: pointer;
  }

  .unit-mark {
    display: inline-grid;
    width: 30px;
    height: 30px;
    place-items: center;
    border-radius: 50%;
    color: white;
    font-size: 12px;
  }

  .enemy-panel .unit-mark {
    background: var(--green);
  }

  .own-panel .unit-mark {
    background: var(--orange);
  }

  select {
    width: 100%;
    min-height: 42px;
    padding: 8px 10px;
    border: 1px solid #bfc6ba;
    border-radius: 9px;
    color: var(--ink);
    font: inherit;
    background: white;
  }

  .field-panel {
    overflow: hidden;
  }

  .field-heading {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }

  .field-heading p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  #selectionField {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
    background: white;
    cursor: crosshair;
  }

  #placementStatus {
    min-height: 3.2em;
    margin: 0;
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 22px;
  }

  .team-file-button {
    min-height: 44px;
    padding: 0 18px;
    border: 1px solid #aeb7a8;
    border-radius: 999px;
    color: #35402f;
    font: inherit;
    font-weight: 800;
    background: #ffffff;
    cursor: pointer;
  }

  #startBattle {
    min-width: min(100%, 320px);
    min-height: 52px;
    padding: 0 24px;
    border: 0;
    border-radius: 999px;
    color: white;
    font: inherit;
    font-weight: 800;
    font-size: 17px;
    background: #30382b;
    box-shadow: 0 8px 18px rgba(35, 42, 31, 0.18);
    cursor: pointer;
  }

  #startBattle:hover {
    background: #171c15;
  }

  button:focus-visible,
  select:focus-visible,
  canvas:focus-visible {
    outline: 3px solid #91a5ff;
    outline-offset: 3px;
  }

  @media (max-width: 900px) {
    body {
      padding: 14px;
    }

    .selection-layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .enemy-panel {
      order: 1;
    }

    .field-panel {
      order: 2;
      width: min(100%, 402px);
      margin: 0 auto;
    }

    .own-panel {
      order: 3;
    }

    .panel-intro {
      min-height: 0;
    }
  }

  @media (max-width: 480px) {
    .page-header h1 small {
      display: block;
      margin: 2px 0 0;
      font-size: 0.48em;
    }
  }
</style>
</head>
<body>
<main class="page-shell">
  <header class="page-header">
    <h1>progrobots <small>プログロボコン</small></h1>
    <p>ロボットのタイプと初期配置を決めて、3対3のプログラムバトルに挑みます。</p>
  </header>

  <div class="selection-layout">
    <section class="panel enemy-panel">
      <h2>1. 相手チームを選択</h2>
      <p class="panel-intro">対戦するチームを選びます。カスタムでは3体を自由に編成できます。</p>

      <label class="team-select-label" for="enemyTeamPreset">相手チーム</label>
      <select id="enemyTeamPreset">
        <option value="level1">Lv1 ファイターズ</option>
        <option value="custom">カスタム</option>
      </select>
      <p id="enemyTeamDescription" class="team-description"></p>

      <div id="enemyCustomUnits" hidden>
        <div class="unit-card">
          <div class="unit-title"><span>相手機1</span><span class="unit-mark">E1</span></div>
          <select class="enemy-type" data-index="0" aria-label="相手機1のタイプ">
            <option value="infighter1">インファイター Lv1</option>
            <option value="infighter2">インファイター Lv2</option>
            <option value="sniper1">スナイパー Lv1</option>
            <option value="sniper2">スナイパー Lv2</option>
            <option value="ninja1">ニンジャ Lv1</option>
            <option value="ninja2">ニンジャ Lv2</option>
          </select>
        </div>
        <div class="unit-card">
          <div class="unit-title"><span>相手機2</span><span class="unit-mark">E2</span></div>
          <select class="enemy-type" data-index="1" aria-label="相手機2のタイプ">
            <option value="infighter1">インファイター Lv1</option>
            <option value="infighter2">インファイター Lv2</option>
            <option value="sniper1">スナイパー Lv1</option>
            <option value="sniper2">スナイパー Lv2</option>
            <option value="ninja1">ニンジャ Lv1</option>
            <option value="ninja2">ニンジャ Lv2</option>
          </select>
        </div>
        <div class="unit-card">
          <div class="unit-title"><span>相手機3</span><span class="unit-mark">E3</span></div>
          <select class="enemy-type" data-index="2" aria-label="相手機3のタイプ">
            <option value="infighter1">インファイター Lv1</option>
            <option value="infighter2">インファイター Lv2</option>
            <option value="sniper1">スナイパー Lv1</option>
            <option value="sniper2">スナイパー Lv2</option>
            <option value="ninja1">ニンジャ Lv1</option>
            <option value="ninja2">ニンジャ Lv2</option>
          </select>
        </div>
      </div>
    </section>

    <section class="field-panel">
      <div class="field-heading">
        <h2>初期配置</h2>
        <p>自機を選び、オレンジ色のエリアをタップして配置します。</p>
      </div>
      <canvas
        id="selectionField"
        width="400"
        height="600"
        tabindex="0"
        aria-label="上部が相手チーム、下部が自チームの配置フィールド"
      ></canvas>
      <p id="placementStatus" aria-live="polite">自機1を選択中です。下のオレンジ色のエリアをタップしてください。</p>
    </section>

    <section class="panel own-panel">
      <h2>2. 自チームを編成・配置</h2>
      <p class="panel-intro">カードで配置する自機を選択し、タイプを決めます。</p>
      <p id="unlockProgress" class="unlock-progress" aria-live="polite"></p>

      <div class="unit-card own-card selected" data-index="0">
        <div class="unit-title">
          <button class="unit-focus" type="button" data-index="0">自機1を選択</button>
          <span class="unit-mark">A1</span>
        </div>
        <select class="own-type" data-index="0" aria-label="自機1のタイプ">
          <option value="infighter1">インファイター Lv1</option>
          <option value="infighter2">インファイター Lv2</option>
          <option value="sniper1">スナイパー Lv1</option>
          <option value="sniper2">スナイパー Lv2</option>
          <option value="ninja1">ニンジャ Lv1</option>
          <option value="ninja2">ニンジャ Lv2</option>
        </select>
      </div>
      <div class="unit-card own-card" data-index="1">
        <div class="unit-title">
          <button class="unit-focus" type="button" data-index="1">自機2を選択</button>
          <span class="unit-mark">A2</span>
        </div>
        <select class="own-type" data-index="1" aria-label="自機2のタイプ">
          <option value="infighter1">インファイター Lv1</option>
          <option value="infighter2">インファイター Lv2</option>
          <option value="sniper1">スナイパー Lv1</option>
          <option value="sniper2">スナイパー Lv2</option>
          <option value="ninja1">ニンジャ Lv1</option>
          <option value="ninja2">ニンジャ Lv2</option>
        </select>
      </div>
      <div class="unit-card own-card" data-index="2">
        <div class="unit-title">
          <button class="unit-focus" type="button" data-index="2">自機3を選択</button>
          <span class="unit-mark">A3</span>
        </div>
        <select class="own-type" data-index="2" aria-label="自機3のタイプ">
          <option value="infighter1">インファイター Lv1</option>
          <option value="infighter2">インファイター Lv2</option>
          <option value="sniper1">スナイパー Lv1</option>
          <option value="sniper2">スナイパー Lv2</option>
          <option value="ninja1">ニンジャ Lv1</option>
          <option value="ninja2">ニンジャ Lv2</option>
        </select>
      </div>
    </section>
  </div>

  <div class="actions">
    <input id="teamFileInput" type="file" accept=".json,application/json" hidden>
    <button id="saveTeamFile" class="team-file-button" type="button">チームを保存</button>
    <button id="loadTeamFile" class="team-file-button" type="button">チームを読み込む</button>
    <button id="startBattle" type="button">この編成でバトルへ</button>
  </div>
</main>

<script>
const FIELD_WIDTH = 400;
const FIELD_HEIGHT = 600;
const OWN_ZONE_TOP = FIELD_HEIGHT * 2 / 3;
const STORAGE_KEY = "progrobots-battle-config-v1";
const ENEMY_TEAM_KEY = "progrobots-enemy-team-v1";
const ENEMY_PROGRESS_KEY = "progrobots-enemy-progress-v1";
const BATTLE_COUNT_KEY = "progrobots-battle-count-v1";
const ACHIEVEMENT_UNLOCKS_KEY = "progrobots-achievement-unlocks-v1";

const typeLabels = {
  infighter1: "インファイター Lv1",
  infighter2: "インファイター Lv2",
  sniper1: "スナイパー Lv1",
  sniper2: "スナイパー Lv2",
  ninja1: "ニンジャ Lv1",
  ninja2: "ニンジャ Lv2"
};

const robotPrograms = {
  infighter1: "robots/infighter-level1.js",
  infighter2: "robots/infighter-level2.js",
  sniper1: "robots/sniper-level1.js",
  sniper2: "robots/sniper-level2.js",
  ninja1: "robots/ninja-level1.js",
  ninja2: "robots/ninja-level2.js"
};

const TEAM_FILE_FORMAT = "progrobots-team";
const TEAM_FILE_VERSION = 1;
const MAX_TEAM_FILE_SIZE = 512 * 1024;
const MAX_ROBOT_CODE_SIZE = 100 * 1024;

const unlockRequirements = {
  infighter1: 0,
  sniper1: 1,
  infighter2: 3,
  sniper2: 6
};

const achievementConditions = {
  ninja1: "相手チームLv4に勝利で解放",
  ninja2: "相手チームLv5に勝利で解放"
};

function loadBattleCount() {
  const savedCount = Number.parseInt(localStorage.getItem(BATTLE_COUNT_KEY), 10);
  return Number.isFinite(savedCount) && savedCount > 0 ? savedCount : 0;
}

function loadAchievementUnlocks() {
  try {
    const saved = JSON.parse(localStorage.getItem(ACHIEVEMENT_UNLOCKS_KEY));
    return {
      ninja1: saved?.ninja1 === true,
      ninja2: saved?.ninja2 === true
    };
  } catch {
    return {ninja1: false, ninja2: false};
  }
}

const battleCount = loadBattleCount();
const achievementUnlocks = loadAchievementUnlocks();

function isRobotUnlocked(type) {
  if (Object.hasOwn(achievementConditions, type)) {
    return achievementUnlocks[type];
  }
  return battleCount >= unlockRequirements[type];
}

function unlockConditionLabel(type) {
  return achievementConditions[type] || `${unlockRequirements[type]}戦で解放`;
}

const enemyTeamPresets = {
  level1: {
    label: "Lv1 ファイターズ",
    type: "infighter1",
    description: "インファイター Lv1 × 3体"
  },
  level2: {
    label: "Lv2 スナイパーズ",
    type: "sniper1",
    description: "スナイパー Lv1 × 3体"
  },
  level3: {
    label: "Lv3 シノビーズ",
    type: "ninja1",
    description: "ニンジャ Lv1 × 3体"
  },
  level4: {
    label: "Lv4 スナイパーズ2",
    type: "sniper2",
    description: "スナイパー Lv2 × 3体"
  },
  level5: {
    label: "Lv5 ファイターズ2",
    type: "infighter2",
    description: "インファイター Lv2 × 3体"
  },
  level6: {
    label: "Lv6 シノビーズ2",
    type: "ninja2",
    description: "ニンジャ Lv2 × 3体"
  },
  custom: {
    label: "カスタム",
    type: null,
    description: "3体のタイプを自由に選択できます。"
  }
};

function loadEnemyProgress() {
  const savedLevel = Number.parseInt(
    localStorage.getItem(ENEMY_PROGRESS_KEY),
    10
  );
  return Number.isFinite(savedLevel)
    ? Math.max(1, Math.min(6, savedLevel))
    : 1;
}

const highestUnlockedEnemyLevel = loadEnemyProgress();

function isEnemyTeamUnlocked(presetKey) {
  if (presetKey === "custom") return true;
  const level = Number.parseInt(presetKey.replace("level", ""), 10);
  return Number.isFinite(level) && level <= highestUnlockedEnemyLevel;
}

const defaultConfig = {
  own: [
    {type: "infighter1", x: 100, y: 500},
    {type: "infighter1", x: 200, y: 500},
    {type: "infighter1", x: 300, y: 500}
  ],
  enemy: [
    {type: "infighter1", x: 100, y: 100},
    {type: "infighter1", x: 200, y: 100},
    {type: "infighter1", x: 300, y: 100}
  ]
};

function normalizeConfig(saved) {
  const validType = type => Object.hasOwn(typeLabels, type);

  return {
    own: defaultConfig.own.map((fallback, index) => {
      const unit = saved?.own?.[index];
      return {
        type: validType(unit?.type) && isRobotUnlocked(unit.type)
          ? unit.type
          : fallback.type,
        x: Number.isFinite(unit?.x) ? Math.max(20, Math.min(380, unit.x)) : fallback.x,
        y: Number.isFinite(unit?.y) ? Math.max(420, Math.min(580, unit.y)) : fallback.y
      };
    }),
    enemy: defaultConfig.enemy.map((fallback, index) => {
      const unit = saved?.enemy?.[index];
      return {
        type: validType(unit?.type) ? unit.type : fallback.type,
        x: fallback.x,
        y: fallback.y
      };
    })
  };
}

function loadConfig() {
  try {
    return normalizeConfig(JSON.parse(localStorage.getItem(STORAGE_KEY)));
  } catch {
    return normalizeConfig(null);
  }
}

let config = loadConfig();

function detectEnemyTeamPreset() {
  const matchingPreset = Object.entries(enemyTeamPresets).find(([key, preset]) =>
    key !== "custom" &&
    config.enemy.every(unit => unit.type === preset.type)
  );
  return matchingPreset?.[0] || "custom";
}

const savedEnemyTeamPreset = localStorage.getItem(ENEMY_TEAM_KEY);
const detectedEnemyTeamPreset = detectEnemyTeamPreset();
let enemyTeamPreset =
  Object.hasOwn(enemyTeamPresets, savedEnemyTeamPreset) &&
  isEnemyTeamUnlocked(savedEnemyTeamPreset)
    ? savedEnemyTeamPreset
    : isEnemyTeamUnlocked(detectedEnemyTeamPreset)
      ? detectedEnemyTeamPreset
      : "level1";

if (enemyTeamPreset !== "custom") {
  config.enemy.forEach(unit => {
    unit.type = enemyTeamPresets[enemyTeamPreset].type;
  });
}

let selectedOwn = 0;

const canvas = document.getElementById("selectionField");
const ctx = canvas.getContext("2d");
const placementStatus = document.getElementById("placementStatus");
const unlockProgress = document.getElementById("unlockProgress");
const enemyTeamSelect = document.getElementById("enemyTeamPreset");
const enemyTeamDescription = document.getElementById("enemyTeamDescription");
const enemyCustomUnits = document.getElementById("enemyCustomUnits");

function drawField() {
  ctx.clearRect(0, 0, FIELD_WIDTH, FIELD_HEIGHT);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, FIELD_WIDTH, FIELD_HEIGHT);

  ctx.fillStyle = "rgba(65, 146, 84, 0.12)";
  ctx.fillRect(0, 0, FIELD_WIDTH, FIELD_HEIGHT / 3);
  ctx.fillStyle = "rgba(232, 129, 36, 0.14)";
  ctx.fillRect(0, OWN_ZONE_TOP, FIELD_WIDTH, FIELD_HEIGHT / 3);

  ctx.save();
  ctx.setLineDash([7, 7]);
  ctx.strokeStyle = "rgba(70, 78, 67, 0.32)";
  ctx.beginPath();
  ctx.moveTo(0, FIELD_HEIGHT / 3);
  ctx.lineTo(FIELD_WIDTH, FIELD_HEIGHT / 3);
  ctx.moveTo(0, OWN_ZONE_TOP);
  ctx.lineTo(FIELD_WIDTH, OWN_ZONE_TOP);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = "rgba(45, 90, 54, 0.7)";
  ctx.font = "bold 13px system-ui";
  ctx.fillText("相手チーム配置エリア", 14, 24);
  ctx.fillStyle = "rgba(145, 75, 18, 0.75)";
  ctx.fillText("自チーム配置エリア", 14, OWN_ZONE_TOP + 24);

  config.enemy.forEach((unit, index) => {
    drawRobot(unit, "#419254", "E" + (index + 1), 90, false);
  });

  config.own.forEach((unit, index) => {
    drawRobot(unit, "#e88124", "A" + (index + 1), 270, index === selectedOwn);
  });
}

function drawRobot(unit, color, label, direction, selected) {
  const isSniper = unit.type.startsWith("sniper");
  const isNinja = unit.type.startsWith("ninja");

  ctx.save();
  ctx.translate(unit.x, unit.y);
  ctx.rotate(direction * Math.PI / 180);

  if (isSniper) {
    ctx.fillStyle = color;
    ctx.fillRect(-13, -10, 26, 20);
    ctx.fillStyle = "#263027";
    ctx.fillRect(5, -3, 22, 6);
  } else if (isNinja) {
    // 軽量な本体と、後方になびく小さな布
    ctx.fillStyle = color;
    ctx.fillRect(-10, -9, 20, 18);
    ctx.beginPath();
    ctx.moveTo(-8, -4);
    ctx.lineTo(-18, -10);
    ctx.lineTo(-15, 1);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#263027";
    ctx.fillRect(3, -6, 7, 12);
  } else {
    ctx.fillStyle = color;
    ctx.fillRect(-12, -12, 24, 24);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(15, -9, 5, 0, Math.PI * 2);
    ctx.arc(15, 9, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  if (selected) {
    ctx.beginPath();
    ctx.arc(unit.x, unit.y, 24, 0, Math.PI * 2);
    ctx.strokeStyle = "#3856c8";
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  ctx.fillStyle = "#202124";
  ctx.font = "bold 12px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(label, unit.x, unit.y + 38);
  ctx.font = "11px system-ui";
  ctx.fillText(isSniper ? "S" : isNinja ? "N" : "I", unit.x, unit.y + 4);
  ctx.textAlign = "start";
}

function refreshControls() {
  const availableEnemyTeams = Object.entries(enemyTeamPresets)
    .filter(([key]) => isEnemyTeamUnlocked(key));
  enemyTeamSelect.replaceChildren(...availableEnemyTeams.map(([key, preset]) => {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = preset.label;
    return option;
  }));
  enemyTeamSelect.value = enemyTeamPreset;

  const nextLevel = highestUnlockedEnemyLevel < 6
    ? highestUnlockedEnemyLevel + 1
    : null;
  const selectedDescription = enemyTeamPresets[enemyTeamPreset].description;
  enemyTeamDescription.textContent =
    enemyTeamPreset === `level${highestUnlockedEnemyLevel}` && nextLevel
      ? `${selectedDescription}　勝利するとLv${nextLevel}を解放します。`
      : selectedDescription;
  enemyCustomUnits.hidden = enemyTeamPreset !== "custom";

  document.querySelectorAll(".enemy-type").forEach(select => {
    select.value = config.enemy[Number(select.dataset.index)].type;
  });

  document.querySelectorAll(".own-type").forEach(select => {
    const index = Number(select.dataset.index);

    select.querySelectorAll("option").forEach(option => {
      const locked = !isRobotUnlocked(option.value);
      option.disabled = locked;
      option.textContent = locked
        ? `${typeLabels[option.value]}（${unlockConditionLabel(option.value)}）`
        : typeLabels[option.value];
    });

    select.value = config.own[index].type;
  });

  const nextUnlock = Object.entries(unlockRequirements)
    .filter(([, requiredBattles]) => requiredBattles > battleCount)
    .sort((a, b) => a[1] - b[1])[0];
  const remainingChallenges = Object.entries(achievementConditions)
    .filter(([type]) => !isRobotUnlocked(type))
    .map(([type, condition]) => `${typeLabels[type]}：${condition}`);

  const progressParts = [`対戦回数：${battleCount}回`];
  if (nextUnlock) {
    progressParts.push(
      `次は${nextUnlock[1]}回で${typeLabels[nextUnlock[0]]}をアンロック`
    );
  } else if (remainingChallenges.length > 0) {
    progressParts.push("対戦回数による解放は完了");
  }
  progressParts.push(...remainingChallenges);
  if (!nextUnlock && remainingChallenges.length === 0) {
    progressParts.push("全機体アンロック済み！");
  }
  unlockProgress.textContent = progressParts.join("　");

  document.querySelectorAll(".own-card").forEach(card => {
    card.classList.toggle("selected", Number(card.dataset.index) === selectedOwn);
  });
}

function selectOwnUnit(index) {
  selectedOwn = index;
  refreshControls();
  drawField();
  placementStatus.textContent = "自機" + (index + 1) + "を選択中です。オレンジ色のエリアをタップしてください。";
}

function saveConfig() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
  localStorage.setItem(ENEMY_TEAM_KEY, enemyTeamPreset);
}

function robotCodeStorageKey(index, type) {
  return `progrobots-robot-code-v1-${index}-${type}`;
}

async function codeForTeamExport(index, type) {
  const savedCode = localStorage.getItem(robotCodeStorageKey(index, type));
  if (savedCode !== null) return savedCode;

  const response = await fetch(robotPrograms[type], {cache: "no-store"});
  if (!response.ok) {
    throw new Error(`${typeLabels[type]}のコードを読み込めませんでした。`);
  }
  return response.text();
}

function downloadTeamJson(teamData) {
  const json = JSON.stringify(teamData, null, 2);
  const blob = new Blob([json], {type: "application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  const date = new Date().toISOString().slice(0, 10);
  link.href = url;
  link.download = `progrobots-team-${date}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function saveTeamFile() {
  const units = await Promise.all(config.own.map(async (unit, index) => ({
    type: unit.type,
    x: unit.x,
    y: unit.y,
    code: await codeForTeamExport(index, unit.type)
  })));

  downloadTeamJson({
    format: TEAM_FILE_FORMAT,
    version: TEAM_FILE_VERSION,
    name: "マイチーム",
    exportedAt: new Date().toISOString(),
    units
  });
}

function validateImportedTeam(teamData) {
  if (
    teamData?.format !== TEAM_FILE_FORMAT ||
    teamData?.version !== TEAM_FILE_VERSION ||
    !Array.isArray(teamData?.units) ||
    teamData.units.length !== 3
  ) {
    throw new Error("プログロボコンのチームファイルではありません。");
  }

  const units = teamData.units.map((unit, index) => {
    if (!Object.hasOwn(typeLabels, unit?.type)) {
      throw new Error(`自機${index + 1}の機体タイプが正しくありません。`);
    }
    if (!isRobotUnlocked(unit.type)) {
      throw new Error(
        `${typeLabels[unit.type]}はまだアンロックされていないため読み込めません。`
      );
    }
    if (
      typeof unit.code !== "string" ||
      unit.code.length === 0 ||
      unit.code.length > MAX_ROBOT_CODE_SIZE
    ) {
      throw new Error(`自機${index + 1}のコードが正しくありません。`);
    }
    if (!Number.isFinite(unit.x) || !Number.isFinite(unit.y)) {
      throw new Error(`自機${index + 1}の配置が正しくありません。`);
    }

    return {
      type: unit.type,
      x: Math.max(20, Math.min(380, Math.round(unit.x))),
      y: Math.max(420, Math.min(580, Math.round(unit.y))),
      code: unit.code
    };
  });

  for (let i = 0; i < units.length; i++) {
    for (let j = i + 1; j < units.length; j++) {
      if (Math.hypot(units[i].x - units[j].x, units[i].y - units[j].y) < 36) {
        throw new Error("機体同士の配置が重なっています。");
      }
    }
  }
  return units;
}

async function loadTeamFile(file) {
  if (file.size > MAX_TEAM_FILE_SIZE) {
    throw new Error("チームファイルが大きすぎます。");
  }

  const units = validateImportedTeam(JSON.parse(await file.text()));
  config.own = units.map(({type, x, y}) => ({type, x, y}));
  units.forEach((unit, index) => {
    localStorage.setItem(robotCodeStorageKey(index, unit.type), unit.code);
  });
  selectedOwn = 0;
  saveConfig();
  refreshControls();
  drawField();
}

enemyTeamSelect.addEventListener("change", event => {
  const requestedPreset = event.target.value;
  if (!isEnemyTeamUnlocked(requestedPreset)) return;

  enemyTeamPreset = requestedPreset;
  const preset = enemyTeamPresets[enemyTeamPreset];

  if (preset.type) {
    config.enemy.forEach(unit => {
      unit.type = preset.type;
    });
  }

  saveConfig();
  refreshControls();
  drawField();
});

document.querySelectorAll(".enemy-type").forEach(select => {
  select.addEventListener("change", event => {
    config.enemy[Number(event.target.dataset.index)].type = event.target.value;
    saveConfig();
    drawField();
  });
});

document.querySelectorAll(".own-type").forEach(select => {
  select.addEventListener("change", event => {
    const index = Number(event.target.dataset.index);
    const requestedType = event.target.value;

    if (!isRobotUnlocked(requestedType)) {
      event.target.value = config.own[index].type;
      placementStatus.textContent =
        typeLabels[requestedType] + "はまだアンロックされていません。";
      return;
    }

    config.own[index].type = requestedType;
    selectedOwn = index;
    saveConfig();
    refreshControls();
    drawField();
    placementStatus.textContent = "自機" + (index + 1) + "を" + typeLabels[event.target.value] + "に変更しました。";
  });
});

document.querySelectorAll(".unit-focus").forEach(button => {
  button.addEventListener("click", () => selectOwnUnit(Number(button.dataset.index)));
});

document.querySelectorAll(".own-card").forEach(card => {
  card.addEventListener("click", event => {
    if (event.target.tagName !== "SELECT" && event.target.tagName !== "OPTION") {
      selectOwnUnit(Number(card.dataset.index));
    }
  });
});

canvas.addEventListener("pointerdown", event => {
  const rect = canvas.getBoundingClientRect();
  const pointerX = (event.clientX - rect.left) * FIELD_WIDTH / rect.width;
  const pointerY = (event.clientY - rect.top) * FIELD_HEIGHT / rect.height;

  const hitIndex = config.own.findIndex(unit =>
    Math.hypot(unit.x - pointerX, unit.y - pointerY) <= 26
  );

  if (hitIndex >= 0) {
    selectOwnUnit(hitIndex);
    return;
  }

  if (pointerY < OWN_ZONE_TOP) {
    placementStatus.textContent = "自チームは、下1/3のオレンジ色のエリア内に配置してください。";
    return;
  }

  const x = Math.max(20, Math.min(380, Math.round(pointerX / 20) * 20));
  const y = Math.max(420, Math.min(580, Math.round(pointerY / 20) * 20));
  const overlaps = config.own.some((unit, index) =>
    index !== selectedOwn && Math.hypot(unit.x - x, unit.y - y) < 36
  );

  if (overlaps) {
    placementStatus.textContent = "ほかの自機と重なるため、少し離れた位置を選んでください。";
    return;
  }

  config.own[selectedOwn].x = x;
  config.own[selectedOwn].y = y;
  saveConfig();
  drawField();
  placementStatus.textContent = "自機" + (selectedOwn + 1) + "を配置しました。";
});

const teamFileInput = document.getElementById("teamFileInput");

document.getElementById("saveTeamFile").addEventListener("click", async () => {
  const button = document.getElementById("saveTeamFile");
  button.disabled = true;
  try {
    await saveTeamFile();
    placementStatus.textContent = "自チームをJSONファイルに保存しました。";
  } catch (error) {
    placementStatus.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

document.getElementById("loadTeamFile").addEventListener("click", () => {
  teamFileInput.click();
});

teamFileInput.addEventListener("change", async event => {
  const file = event.target.files?.[0];
  if (!file) return;

  try {
    await loadTeamFile(file);
    placementStatus.textContent =
      `「${file.name}」から自チームを読み込みました。`;
  } catch (error) {
    placementStatus.textContent =
      error instanceof SyntaxError
        ? "JSONファイルを読み取れませんでした。"
        : error.message;
  } finally {
    event.target.value = "";
  }
});

document.getElementById("startBattle").addEventListener("click", () => {
  const lockedUnit = config.own.find(unit => !isRobotUnlocked(unit.type));
  if (lockedUnit) {
    placementStatus.textContent =
      typeLabels[lockedUnit.type] + "はまだアンロックされていません。";
    return;
  }

  saveConfig();
  // 毎回最新のバトルページを読み込む
  window.location.href = "battle/?v=" + Date.now();
});

refreshControls();
drawField();
</script>
</body>
</html>
